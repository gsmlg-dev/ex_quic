name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.2)"
        required: true
        type: string
      git_ref:
        description: "Branch to release from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: ${{ inputs.git_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate release
        id: revision
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git check-ref-format --branch "$RELEASE_BRANCH"
          test "$(git branch --show-current)" = "$RELEASE_BRANCH"
          if git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            git merge-base --is-ancestor "refs/tags/v$RELEASE_VERSION" HEAD
            git checkout --detach "refs/tags/v$RELEASE_VERSION"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Hex credentials
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "Configure the HEX_API_KEY Actions secret with package publish permission." >&2
            exit 1
          fi

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.1'
          otp-version: '29.0'

      - name: Update version
        if: steps.revision.outputs.existing == 'false'
        run: |
          sed -i.bak -E "s/version: \"[^\"]+\"/version: \"$RELEASE_VERSION\"/" mix.exs
          rm -f mix.exs.bak

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Verify release source
        env:
          MIX_ENV: test
        run: |
          mix format --check-formatted
          mix format --check-formatted scripts/phase1/interop.exs scripts/phase1/release_check.exs
          mix compile --warnings-as-errors
          mix run --no-start -e 'config = Mix.Project.config(); unless config[:app] == :elixir_quic and config[:version] == System.fetch_env!("RELEASE_VERSION"), do: raise("release identity mismatch")'
          mix test --seed 28092026
          git diff --check
          git diff --exit-code -- mix.lock

      - name: Build Hex package
        run: |
          mix hex.build --output "_build/elixir_quic-$RELEASE_VERSION.tar"

      - name: Commit version bump
        if: steps.revision.outputs.existing == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mix.exs
          git commit -m "chore(release): v$RELEASE_VERSION"

      - name: Create and push version tag
        if: steps.revision.outputs.existing == 'false'
        run: |
          git tag "v$RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$RELEASE_VERSION"

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          archive="_build/elixir_quic-$RELEASE_VERSION.tar"
          metadata="$RUNNER_TEMP/hex-release.json"
          status=$(curl --silent --show-error --output "$metadata" --write-out '%{http_code}' \
            "https://hex.pm/api/packages/elixir_quic/releases/$RELEASE_VERSION")
          case "$status" in
            200)
              python3 -c 'import hashlib,json,sys; expected=json.load(open(sys.argv[1]))["checksum"]; actual=hashlib.sha256(open(sys.argv[2], "rb").read()).hexdigest(); assert expected == actual, "Existing Hex package differs from release source"' "$metadata" "$archive"
              echo "Matching Hex package already published."
              ;;
            404) mix hex.publish package --yes ;;
            *) echo "Hex registry check failed: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "v$RELEASE_VERSION" "_build/elixir_quic-$RELEASE_VERSION.tar" --clobber
          else
            gh release create "v$RELEASE_VERSION" "_build/elixir_quic-$RELEASE_VERSION.tar" \
              --verify-tag \
              --title "v$RELEASE_VERSION" \
              --notes "Published to Hex.pm: https://hex.pm/packages/elixir_quic/$RELEASE_VERSION" \
              --generate-notes
          fi
