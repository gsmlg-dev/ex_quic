name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
        type: string
      git_ref:
        description: "Branch to release from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: ${{ inputs.git_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate release
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git check-ref-format --branch "$RELEASE_BRANCH"
          test "$(git branch --show-current)" = "$RELEASE_BRANCH"
          if git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "Release tag already exists" >&2
            exit 1
          fi

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.1'
          otp-version: '29.0'

      - name: Update version
        run: |
          sed -i.bak -E "s/version: \"[^\"]+\"/version: \"$RELEASE_VERSION\"/" mix.exs
          rm -f mix.exs.bak

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Verify release source
        env:
          MIX_ENV: test
        run: |
          mix format --check-formatted
          mix format --check-formatted scripts/phase1/interop.exs scripts/phase1/release_check.exs
          mix compile --warnings-as-errors
          mix test --seed 28092026
          git diff --check
          git diff --exit-code -- mix.lock

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mix.exs
          git commit -m "chore(release): v$RELEASE_VERSION"

      - name: Create and push version tag
        run: |
          git tag "v$RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$RELEASE_VERSION"

      # Hex packages cannot preserve the required Git-pinned ex_ssl dependency.
      - name: Create GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --verify-tag \
            --title "v$RELEASE_VERSION" \
            --notes "GitHub source release. The required ex_ssl dependency remains pinned to its accepted Git SHA; this release is not published to Hex." \
            --generate-notes
