name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Shared package version (e.g. 1.0.0)"
        required: true
        type: string
      git_ref:
        description: "Branch to release from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: release-all-packages
  cancel-in-progress: false

jobs:
  release:
    name: Release all three packages
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: ${{ inputs.git_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate release revision
        id: revision
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git check-ref-format --branch "$RELEASE_BRANCH"
          test "$(git branch --show-current)" = "$RELEASE_BRANCH"
          if git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            git merge-base --is-ancestor "refs/tags/v$RELEASE_VERSION" HEAD
            git checkout --detach "refs/tags/v$RELEASE_VERSION"
            if [ ! -f scripts/release/versions.exs ]; then
              echo "Existing tag lacks the three-package release contract; it cannot be reused." >&2
              exit 1
            fi
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Hex credentials
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "Configure HEX_API_KEY with publish permission for ex_ssl, elixir_quic, and elixir_quic_http3." >&2
            exit 1
          fi

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.1'
          otp-version: '29.0'

      - name: Prepare or validate shared version and dependency graph
        run: |
          if [ "${{ steps.revision.outputs.existing }}" = true ]; then
            elixir scripts/release/versions.exs validate "$RELEASE_VERSION"
          else
            elixir scripts/release/versions.exs prepare "$RELEASE_VERSION"
          fi

      - name: Install dependencies
        run: |
          unset EX_QUIC_CI_APP
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Verify release source
        env:
          MIX_ENV: test
        run: |
          unset EX_QUIC_CI_APP
          mix format --check-formatted
          mix format --check-formatted scripts/phase1/interop.exs scripts/phase1/release_check.exs
          mix format --check-formatted scripts/datagram/interop.exs
          mix format --check-formatted scripts/release/versions.exs
          mix format --check-formatted scripts/release/archives.exs
          mix compile --warnings-as-errors
          mix test --seed 28092026
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          git diff --check
          git diff --exit-code -- mix.lock

      - name: Build three Hex archives
        run: |
          unset EX_QUIC_CI_APP
          mkdir -p _build
          for package in ex_ssl elixir_quic elixir_quic_http3; do
            (cd "apps/$package" && mix hex.build --output "$GITHUB_WORKSPACE/_build/$package-$RELEASE_VERSION.tar")
          done

      - name: Preflight all Hex releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unset EX_QUIC_CI_APP
          elixir scripts/release/archives.exs "$RELEASE_VERSION" _build
          python3 scripts/release/hex_packages.py preflight "$RELEASE_VERSION" _build
          python3 scripts/release/github_assets.py preflight "$RELEASE_VERSION" _build

      - name: Commit version bump
        if: steps.revision.outputs.existing == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mix.exs apps/ex_ssl/mix.exs apps/elixir_quic/mix.exs apps/elixir_quic_http3/mix.exs
          git commit -m "chore(release): v$RELEASE_VERSION"

      - name: Create and push version tag
        if: steps.revision.outputs.existing == 'false'
        run: |
          git tag "v$RELEASE_VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$RELEASE_VERSION"

      - name: Publish and verify all Hex packages
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          unset EX_QUIC_CI_APP
          python3 scripts/release/hex_packages.py publish "$RELEASE_VERSION" _build

      - name: Create or complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/github_assets.py complete "$RELEASE_VERSION" _build
