name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      workflow_file: test.yml

  test:
    name: Unit tests (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      EX_QUIC_CI_APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.1'
          otp-version: '29.0'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: test-${{ matrix.app }}-${{ runner.os }}-otp29.0-elixir1.20.1-${{ hashFiles('mix.lock', 'mix.exs', format('apps/{0}/mix.exs', matrix.app)) }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile selected app and dependencies
        run: mix compile --warnings-as-errors

      - name: Run selected app tests
        run: mix test "apps/${EX_QUIC_CI_APP}/test" --seed 28092026
